syntax = "proto3";

option csharp_namespace = "SadGrpcService";

service LessonsGetter {
  rpc GetLesson(LessonRequest) returns (LessonResponse);
}

message LessonRequest {
	int32 id = 1;
}

message Lesson {
	string date = 1;
	int32 sheduledLessonId = 2;
}

message LessonResponse {
	Lesson lesson = 1;
}